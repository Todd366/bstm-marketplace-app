<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed — BSTM</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap");
    *{font-family:'Inter',sans-serif;box-sizing:border-box;}
    html,body{overflow-x:hidden;max-width:100vw;background:#F8F7FF;}
    @keyframes pop{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .pop{animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;}
    .float{animation:float 3s ease-in-out infinite;}
  </style>
</head>
<body style="background:#F8F7FF;">
<div id="bstm-nav"></div>

<div style="max-width:520px;margin:0 auto;padding:40px 20px 80px;">

  <div class="pop" style="text-align:center;margin-bottom:24px;">
    <div class="float" style="font-size:72px;margin-bottom:16px;">🎉</div>
    <h1 style="font-size:32px;font-weight:900;color:#1E1B4B;margin-bottom:8px;">Order Placed!</h1>
    <p style="color:#6B7280;font-size:15px;">Thank you for shopping with BSTM Marketplace</p>
  </div>

  <div class="pop" style="background:#fff;border-radius:24px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,0.06);margin-bottom:16px;">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="width:72px;height:72px;background:linear-gradient(135deg,#059669,#34D399);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;">✓</div>
      <div style="font-size:13px;color:#9CA3AF;font-weight:600;margin-bottom:6px;">ORDER NUMBER</div>
      <div id="order-number" style="font-size:20px;font-weight:900;color:#7C3AED;">#BSTM-LOADING</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
      <div style="background:#F0FDF4;border-radius:12px;padding:14px;text-align:center;">
        <div style="font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">STATUS</div>
        <div style="font-weight:800;color:#059669;">✅ Confirmed</div>
      </div>
      <div style="background:#F8F7FF;border-radius:12px;padding:14px;text-align:center;">
        <div style="font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">DELIVERY</div>
        <div style="font-weight:800;color:#1E1B4B;">~2 hours</div>
      </div>
    </div>

    <div style="background:#FEF9C3;border-radius:14px;padding:14px;margin-bottom:20px;text-align:center;">
      <div style="font-size:14px;font-weight:700;color:#92400E;">⚡ You earned THB rewards!</div>
      <div style="font-size:12px;color:#92400E;margin-top:2px;">Check your wallet for your balance</div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a href="order-tracking.html" style="flex:1;background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px;border-radius:14px;font-weight:800;text-decoration:none;text-align:center;min-width:120px;">📦 Track Order</a>
      <a href="marketplace.html" style="flex:1;background:#F5F3FF;color:#7C3AED;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;text-align:center;min-width:120px;">🏬 Keep Shopping</a>
    </div>
  </div>

  <div style="text-align:center;">
    <a href="buyer-dashboard.html" style="color:#9CA3AF;font-size:13px;text-decoration:none;">← Back to Dashboard</a>
  </div>
</div>

<div id="bstm-footer"></div>
<script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js"></script>
<script>
// Get order ID from URL params if available
var params = new URLSearchParams(window.location.search);
var orderId = params.get('order') || ('BSTM-' + Math.random().toString(36).substr(2,9).toUpperCase());
document.getElementById('order-number').textContent = '#' + orderId;
</script>
</body>
</html>
