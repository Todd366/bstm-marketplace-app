  <link rel="manifest" href="/manifest.json">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");
    *{font-family:'Inter',sans-serif;box-sizing:border-box;}
    html,body{overflow-x:hidden;max-width:100vw;background:#F8F7FF;}
  </style>

<body style="background:#F8F7FF;">
<div id="bstm-nav"></div>

<div style="max-width:700px;margin:0 auto;padding:32px 20px 80px;">
  <div style="margin-bottom:24px;">
    <h1 style="font-size:28px;font-weight:900;color:#1E1B4B;margin-bottom:4px;">💳 Transactions</h1>
    <p style="color:#9CA3AF;font-size:14px;">Your complete payment history</p>
  </div>

  <!-- Auth wall -->
  <div id="auth-wall" style="display:none;text-align:center;padding:80px 20px;">
    <div style="font-size:56px;margin-bottom:16px;">🔒</div>
    <h2 style="font-size:22px;font-weight:900;color:#1E1B4B;margin-bottom:8px;">Login Required</h2>
    <a href="login.html" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px 32px;border-radius:14px;font-weight:800;text-decoration:none;">Login →</a>
  </div>

  <!-- Content -->
  <div id="tx-content" style="display:none;">
    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;">
      <div style="background:#fff;border-radius:16px;padding:16px;border:1px solid #EDE9FE;text-align:center;">
        <div style="font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">TOTAL SPENT</div>
        <div id="total-spent" style="font-size:20px;font-weight:900;color:#EF4444;">P0.00</div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:16px;border:1px solid #EDE9FE;text-align:center;">
        <div style="font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">TOTAL ORDERS</div>
        <div id="total-orders" style="font-size:20px;font-weight:900;color:#1E1B4B;">0</div>
      </div>
      <div style="background:#fff;border-radius:16px;padding:16px;border:1px solid #EDE9FE;text-align:center;">
        <div style="font-size:11px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">THB EARNED</div>
        <div id="thb-earned" style="font-size:20px;font-weight:900;color:#7C3AED;">0.00</div>
      </div>
    </div>

    <!-- Transaction list -->
    <div style="background:#fff;border-radius:20px;border:1px solid #EDE9FE;overflow:hidden;">
      <div style="padding:16px 20px;border-bottom:1px solid #F3F4F6;font-weight:800;color:#1E1B4B;">Transaction History</div>
      <div id="tx-list" style="padding:20px;text-align:center;color:#9CA3AF;">
        <div style="font-size:36px;margin-bottom:12px;">📋</div>
        <div>No transactions yet. Place your first order!</div>
        <a href="marketplace.html" style="display:inline-block;margin-top:16px;background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;text-decoration:none;">Browse Marketplace</a>
      </div>
    </div>
  </div>
</div>

<div id="bstm-footer"></div>
<script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module">
import { getOrders } from './js/bstm-core.js';

window.BSTM.ready().then(async function(session) {
  if (!session) {
    document.getElementById('auth-wall').style.display = 'block';
    return;
  }
  document.getElementById('tx-content').style.display = 'block';

  var { data: orders } = await getOrders(session.user.id);
  if (!orders || orders.length === 0) return;

  document.getElementById('total-orders').textContent = orders.length;

  var totalSpent = orders.reduce(function(sum, o) { return sum + (Number(o.total_amount) || 0); }, 0);
  document.getElementById('total-spent').textContent = 'P' + totalSpent.toFixed(2);

  var thbEarned = totalSpent * 0.01;
  document.getElementById('thb-earned').textContent = thbEarned.toFixed(2) + ' THB';

  document.getElementById('tx-list').innerHTML = orders.map(function(o) {
    var date = new Date(o.created_at).toLocaleDateString('en-BW', {day:'numeric',month:'short',year:'numeric'});
    var statusColor = o.status === 'delivered' ? '#059669' : o.status === 'pending' ? '#D97706' : '#7C3AED';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #F9FAFB;">'
      + '<div>'
      + '<div style="font-weight:700;color:#1E1B4B;font-size:14px;">Order #' + String(o.id).slice(-8).toUpperCase() + '</div>'
      + '<div style="font-size:12px;color:#9CA3AF;margin-top:2px;">' + date + '</div>'
      + '</div>'
      + '<div style="text-align:right;">'
      + '<div style="font-weight:900;color:#1E1B4B;">P' + Number(o.total_amount || 0).toFixed(2) + '</div>'
      + '<div style="font-size:11px;font-weight:700;color:' + statusColor + ';margin-top:2px;">' + (o.status || 'pending').toUpperCase() + '</div>'
      + '</div>'
      + '</div>';
  }).join('');
});

</script>

};
