<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product — BSTM Seller</title>
  <link href="css/tailwind.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");
    *{font-family:'Inter',sans-serif;box-sizing:border-box;}
    html,body{overflow-x:hidden;max-width:100vw;background:#F8F7FF;}
    .gradient-bg{background:linear-gradient(135deg,#7C3AED 0%,#4F46E5 100%);}
    .image-preview{width:100px;height:100px;object-fit:cover;}
    .drop-zone{border:2px dashed #DDD6FE;transition:all 0.3s;border-radius:12px;}
    .drop-zone.dragover{border-color:#7C3AED;background:#F5F3FF;}
  </style>
</head>
<body style="background:#F8F7FF;">
<div id="bstm-nav"></div>



<div class="max-w-4xl mx-auto px-6 py-8">
  <form id="productForm" class="space-y-6">

    <!-- Images -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6"><i class="fas fa-images text-purple-600 mr-3"></i>Product Images</h2>
      <div class="drop-zone p-8 text-center mb-6" id="dropZone" onclick="document.getElementById('imageInput').click()">
        <i class="fas fa-cloud-upload-alt text-6xl text-gray-400 mb-4 block"></i>
        <p class="text-gray-600 mb-2">Drag & drop images here or tap to browse</p>
        <p class="text-sm text-gray-500">Up to 5 images · JPG, PNG · Max 5MB each</p>
        <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
        <button type="button" onclick="event.stopPropagation();document.getElementById('imageInput').click()" class="mt-4 bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold">Choose Files</button>
      </div>
      <div id="imagePreview" class="flex flex-wrap gap-3"></div>
    </div>

    <!-- Basic Info -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6"><i class="fas fa-info-circle text-purple-600 mr-3"></i>Basic Information</h2>
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Product Title *</label>
        <input type="text" id="title" required maxlength="100" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" placeholder="e.g., Fresh Organic Tomatoes (5kg)">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Description *</label>
        <textarea id="description" required rows="5" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" placeholder="Describe your product in detail..."></textarea>
      </div>
      <div class="grid grid-cols-1 gap-6">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Category *</label>
          <select id="category" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
            <option value="">Select Category</option>
            <option value="fresh-produce">Fresh Produce (Room 22)</option>
            <option value="electronics">Electronics & Gadgets</option>
            <option value="fashion">Fashion & Accessories</option>
            <option value="home">Home & Garden</option>
            <option value="vehicles">Vehicles & Auto Parts</option>
            <option value="services">Services & Skills</option>
            <option value="agriculture">Agriculture & Livestock</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Condition *</label>
          <select id="condition" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
            <option value="">Select Condition</option>
            <option value="new">New</option>
            <option value="like-new">Like New</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Pricing -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6"><i class="fas fa-tag text-purple-600 mr-3"></i>Pricing</h2>
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Price (BWP) *</label>
        <div class="relative">
          <span class="absolute left-4 top-4 text-gray-500 font-bold">P</span>
          <input type="number" id="price" required min="1" step="0.01" class="w-full pl-10 pr-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" placeholder="0.00" oninput="calcEarnings(this.value)">
        </div>
      </div>
      <div class="bg-purple-50 border-2 border-purple-200 rounded-lg p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="font-semibold text-gray-800">BSTM Commission: 5%</p>
            <p class="text-sm text-gray-600">You'll receive 95% of the sale price</p>
          </div>
          <p class="text-2xl font-bold text-purple-600" id="earnings">P0.00</p>
        </div>
      </div>
    </div>

    <!-- Inventory -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6"><i class="fas fa-boxes text-purple-600 mr-3"></i>Inventory & Location</h2>
      <div class="grid grid-cols-1 gap-6">
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Quantity Available *</label>
          <input type="number" id="quantity" required min="1" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" placeholder="0">
        </div>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Location *</label>
          <select id="location" required class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
            <option value="">Select Location</option>
            <option value="Gaborone">Gaborone</option>
            <option value="Francistown">Francistown</option>
            <option value="Maun">Maun</option>
            <option value="Molepolole">Molepolole</option>
            <option value="Kasane">Kasane</option>
            <option value="Palapye">Palapye</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div id="upload-status" style="display:none;padding:14px;border-radius:12px;font-weight:600;font-size:14px;margin-bottom:16px;"></div>
      <button type="submit" id="submit-btn" class="w-full gradient-bg text-white py-4 px-8 rounded-xl font-bold text-lg">
        <i class="fas fa-check-circle mr-2"></i>Publish Product
      </button>
      <p class="text-sm text-center text-gray-500 mt-4"><i class="fas fa-info-circle mr-1"></i>Your product will be reviewed within 24 hours</p>
    </div>
  </form>
</div>

<div id="bstm-footer"></div>
<script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js"></script>

<script>
/**
 * BSTM SAFE RUNTIME BRIDGE
 * prevents onclick breakage without modifying architecture
 */
window.__BSTM_BRIDGE_INSTALLED__ = true;

window.__bstm_safe_bind = function(fnName, fallback) {
    if (typeof window[fnName] !== 'function') {
        window[fnName] = fallback || function() {
            console.warn('[BSTM] Missing function:', fnName);
        };
    }
};
</script>

<script type="module" src="js/pages/upload-product.js"></script>
<script>
// Keep real File objects (window.__bstm_uploadedFiles) for upload-product.js
// to actually upload, alongside base64 previews for display only.
window.__bstm_uploadedFiles = [];
var uploadedImages = [];

document.getElementById('imageInput').addEventListener('change', function(e) {
  Array.from(e.target.files).forEach(function(file) {
    if (uploadedImages.length >= 5) return;
    window.__bstm_uploadedFiles.push(file);
    var reader = new FileReader();
    reader.onload = function(ev) {
      uploadedImages.push(ev.target.result);
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
});

var dz = document.getElementById('dropZone');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('dragover'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('dragover');
  Array.from(e.dataTransfer.files).forEach(function(file){
    if(uploadedImages.length>=5) return;
    window.__bstm_uploadedFiles.push(file);
    var r=new FileReader(); r.onload=function(ev){ uploadedImages.push(ev.target.result); renderPreviews(); }; r.readAsDataURL(file);
  });
});

function renderPreviews() {
  document.getElementById('imagePreview').innerHTML = uploadedImages.map(function(img, i) {
    return '<div style="position:relative;width:80px;height:80px;">'
      + '<img src="' + img + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;">'
      + '<button type="button" onclick="removeImg(' + i + ')" style="position:absolute;top:-6px;right:-6px;background:#EF4444;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;">×</button>'
      + '</div>';
  }).join('');
}

window.removeImg = function(i) {
  uploadedImages.splice(i,1);
  window.__bstm_uploadedFiles.splice(i,1);
  renderPreviews();
};

function calcEarnings(val) {
  var n = parseFloat(val) || 0;
  document.getElementById('earnings').textContent = 'P' + (n * 0.95).toFixed(2);
}
</script>
