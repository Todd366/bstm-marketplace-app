<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Notifications - BSTM</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
    <link href="css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
</head>
<body class="bg-gray-50">
    
    <!-- Navigation -->
    <div id="bstm-nav"></div>

    <div class="max-w-4xl mx-auto px-6 py-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold text-gray-800 mb-2">
                    <i class="fas fa-bell text-purple-600 mr-3"></i>Notifications
                </h1>
                <p class="text-gray-600">Stay updated with your BSTM activity</p>
            </div>
            <button onclick="markAllAsRead()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-semibold">
                <i class="fas fa-check-double mr-2"></i>Mark All Read
            </button>
        </div>

        <!-- Filter Tabs -->
        <div class="bg-white rounded-2xl shadow-lg mb-8">
            <div class="flex border-b">
                <button onclick="filterNotifications('all')" class="notif-filter active flex-1 py-4 font-bold text-purple-600 border-b-2 border-purple-600">
                    All
                </button>
                <button onclick="filterNotifications('order')" class="notif-filter flex-1 py-4 font-bold text-gray-600">
                    Orders
                </button>
                <button onclick="filterNotifications('message')" class="notif-filter flex-1 py-4 font-bold text-gray-600">
                    Messages
                </button>
            </div>
        </div>

        <!-- Notifications List -->
        <div id="notificationsList" class="space-y-4">
            <!-- Will be populated by JS -->
        </div>

    </div>

    <!-- Footer -->
    <div id="bstm-footer"></div>

    <script>
    function formatTime(timestamp) {
        const diff = Date.now() - new Date(timestamp).getTime();
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        if (minutes < 1) return 'Just now';
        if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
        if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
        if (days < 7) return `${days} day${days > 1 ? 's' : ''} ago`;
        return new Date(timestamp).toLocaleDateString();
    }
    </script>
    <script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js?v=1786828104"></script>

<script type="module" src="js/pages/notifications-all.js"></script>

</body>
</html>
