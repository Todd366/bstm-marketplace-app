<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room - BSTM Digital Mall</title>
    <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#00708E">
    <link href="css/tailwind.css" rel="stylesheet">
  <link href="css/bstm-theme.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="bstm-nav"></div>

    <div id="room-not-found" class="hidden">
        <div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;flex-direction:column;text-align:center;">
            <div style="font-size:56px;margin-bottom:16px;">🚪</div>
            <p style="color:var(--bstm-muted);font-size:15px;margin-bottom:24px;">This room doesn't exist or has closed.</p>
            <a href="marketplace.html" style="background:var(--bstm-grad);color:#fff;padding:14px 28px;border-radius:14px;font-weight:800;text-decoration:none;">Browse the Mall</a>
        </div>
    </div>

    <div id="room-content" class="hidden">
        <div id="room-banner" class="py-12 px-6 text-white">
            <div class="max-w-6xl mx-auto">
                <div id="welcome-banner" class="hidden bg-white/20 backdrop-blur rounded-xl p-4 mb-4 text-sm font-semibold">
                    🎉 Your room is live! Start adding products below.
                </div>
                <div class="flex items-center gap-5">
                    <div id="room-emoji" class="text-6xl"></div>
                    <div>
                        <p class="text-sm opacity-80 font-semibold" id="room-number-label"></p>
                        <h1 class="text-3xl font-bold" id="room-name"></h1>
                        <p class="opacity-90 mt-1" id="room-description"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-6 py-10">
            <div id="room-owner-actions" class="hidden mb-6">
                <a href="upload-product.html" class="inline-block gradient-bg text-white px-6 py-3 rounded-xl font-bold" style="background:var(--bstm-grad);">
                    + Add a Product to This Room
                </a>
            </div>

            <h2 id="room-products-heading" class="text-xl font-bold text-gray-800 mb-4">Products</h2>
            <div id="room-products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <p class="text-gray-400 text-sm col-span-full">Loading…</p>
            </div>

            <!-- Room business info — only rendered if the owner set at least one field -->
            <div id="room-info-card" class="hidden mt-10 bg-white rounded-2xl shadow p-6" style="max-width:560px;">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Visit This Room</h2>
                <div id="room-info-rows" class="space-y-2 text-sm text-gray-700"></div>
            </div>

            <!-- Reviews summary — real ratings from reviews on this room's products -->
            <div class="mt-10">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Reviews</h2>
                <div id="room-reviews-summary" class="text-sm text-gray-500 mb-4">Loading reviews…</div>
                <div id="room-reviews-list" class="space-y-3"></div>
            </div>

            <!-- Q&A — real community questions, publicly visible, answerable by room owner/staff -->
            <div class="mt-10">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Questions &amp; Answers</h2>
                <div id="qa-ask-box" class="hidden bg-brand-50 rounded-2xl p-5 mb-5">
                    <textarea id="qa-question-input" rows="2" placeholder="Ask this room a question…"
                        class="w-full px-4 py-3 border-2 border-brand-200 rounded-xl focus:outline-none focus:border-brand-500 text-sm"></textarea>
                    <div class="flex justify-between items-center mt-2">
                        <p id="qa-error" class="hidden text-red-600 text-xs"></p>
                        <button id="qa-submit-btn" class="ml-auto bg-brand-600 hover:bg-brand-700 text-white px-5 py-2 rounded-xl font-semibold text-sm">Post Question</button>
                    </div>
                </div>
                <a id="qa-login-prompt" href="login.html" class="hidden block text-sm text-brand-600 font-semibold mb-5">Log in to ask a question →</a>
                <div id="room-qa-list" class="space-y-4">
                    <p class="text-sm text-gray-400">Loading…</p>
                </div>
            </div>
        </div>
    </div>

    <div id="bstm-footer"></div>
    <script src="components/smart-loader.js"></script>
    <script type="module" src="js/app.js?v=1792108428"></script>
    <script type="module" src="js/pages/room.js?v=1792108428"></script>
</body>
</html>
