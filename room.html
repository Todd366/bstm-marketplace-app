<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room - BSTM Digital Mall</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7C3AED">
    <link href="css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div id="bstm-nav"></div>

    <div id="room-not-found" class="hidden" style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;flex-direction:column;text-align:center;">
        <div style="font-size:56px;margin-bottom:16px;">🚪</div>
        <p style="color:#6B7280;font-size:15px;margin-bottom:24px;">This room doesn't exist or has closed.</p>
        <a href="marketplace.html" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px 28px;border-radius:14px;font-weight:800;text-decoration:none;">Browse the Mall</a>
    </div>

    <div id="room-content" class="hidden">
        <div id="room-banner" class="py-12 px-6 text-white">
            <div class="max-w-6xl mx-auto">
                <div id="welcome-banner" class="hidden bg-white/20 backdrop-blur rounded-xl p-4 mb-4 text-sm font-semibold">
                    🎉 Your room is live! Start adding products below.
                </div>
                <div class="flex items-center gap-5">
                    <div id="room-emoji" class="text-6xl"></div>
                    <div>
                        <p class="text-sm opacity-80 font-semibold" id="room-number-label"></p>
                        <h1 class="text-3xl font-bold" id="room-name"></h1>
                        <p class="opacity-90 mt-1" id="room-description"></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-6xl mx-auto px-6 py-10">
            <div id="room-owner-actions" class="hidden mb-6">
                <a href="upload-product.html" class="inline-block gradient-bg text-white px-6 py-3 rounded-xl font-bold" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);">
                    + Add a Product to This Room
                </a>
            </div>

            <h2 id="room-products-heading" class="text-xl font-bold text-gray-800 mb-4">Products</h2>
            <div id="room-products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <p class="text-gray-400 text-sm col-span-full">Loading…</p>
            </div>
        </div>
    </div>

    <div id="bstm-footer"></div>
    <script src="components/smart-loader.js"></script>
    <script type="module" src="js/app.js?v=1786828104"></script>
    <script type="module" src="js/pages/room.js?v=1788260255"></script>
</body>
</html>
