<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - BSTM Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
    <link href="css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); }
        .message-sent { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); color: white; }
        .message-received { background: #f3f4f6; color: #1f2937; }
        .chat-area { height: calc(100vh - 400px); min-height: 400px; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="bstm-nav"></div>
    
    <!-- Header -->
    

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Conversation List -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="p-4 border-b">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" placeholder="Search messages..." class="w-full pl-10 pr-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-purple-600">
                        </div>
                    </div>

                    <div id="conversation-list" class="divide-y max-h-screen overflow-y-auto">
                        <p class="p-4 text-sm text-gray-500">Loading conversations…</p>
                    </div>
                </div>
            </div>

            <!-- Chat Window -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <!-- Chat Header -->
                    <div id="chat-header" class="p-6 border-b bg-gradient-to-r from-purple-50 to-indigo-50 hidden">
                        <div class="flex items-center space-x-4">
                            <img src="https://via.placeholder.com/50" alt="" class="w-14 h-14 rounded-full border-2 border-white">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg" id="chat-partner-name">—</h3>
                                <p class="text-sm text-gray-500" id="chat-product-name"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="chat-area p-6 overflow-y-auto bg-gray-50">
                        <div id="chat-messages" class="space-y-4">
                            <p class="text-center text-gray-400 text-sm">Select a conversation to start chatting.</p>
                        </div>
                    </div>

                    <!-- Message Input -->
                    <div class="p-4 border-t bg-white">
                        <form id="message-form" class="flex items-center space-x-3">
                            <input type="text" id="message-input" placeholder="Type a message..." class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-purple-600" disabled>
                            <button type="submit" id="message-send-btn" class="gradient-bg text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all" disabled>
                                <i class="fas fa-paper-plane mr-2"></i>Send
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bstm-footer"></div>
    <script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js?v=1786828104"></script>

<script type="module" src="js/pages/messages.js?v=1788260255"></script>

</body>
</html>
