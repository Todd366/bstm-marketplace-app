<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter — BSTM</title>
  <link href="css/tailwind.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap");
    * { font-family:"Inter",sans-serif; box-sizing:border-box; }
    html,body { overflow-x:hidden; max-width:100vw; background:#F8F7FF; }
    .card { background:#fff; border-radius:18px; padding:18px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
    .layout { display:grid; grid-template-columns:1fr; gap:16px; }
    @media (min-width: 900px) { .layout { grid-template-columns:1.5fr 1fr; align-items:start; } #cart-panel { position:sticky; top:12px; } }
    .tile { text-align:left; background:#fff; border:1.5px solid #EDE9FE; border-radius:14px; padding:12px; cursor:pointer; min-height:78px; }
    .tile:active { background:#F5F3FF; border-color:#7C3AED; }
    .tile .nm { font-weight:800; color:#1E1B4B; font-size:14px; line-height:1.2; }
    .tile .pr { font-weight:900; color:#7C3AED; font-size:15px; margin-top:4px; }
    .tile .st { font-size:11px; color:#9CA3AF; font-weight:600; }
    .tile .st.low { color:#B45309; }
    .grid-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .shelf-h { font-size:12px; font-weight:800; color:#6B7280; letter-spacing:.5px; text-transform:uppercase; margin:16px 0 8px; }
    .pill { padding:10px 14px; border-radius:12px; border:1.5px solid #DDD6FE; background:#F5F3FF; color:#7C3AED; font-weight:800; font-size:13px; cursor:pointer; }
    .pill.on { background:#7C3AED; color:#fff; border-color:#7C3AED; }
    .qbtn { width:34px; height:34px; border-radius:10px; border:1.5px solid #DDD6FE; background:#fff; font-weight:900; font-size:18px; color:#7C3AED; cursor:pointer; }
    .inp { width:100%; padding:10px; border:2px solid #E5E7EB; border-radius:10px; font-size:14px; }
    .btn-main { width:100%; padding:16px; border-radius:14px; border:none; background:linear-gradient(135deg,#059669,#10B981); color:#fff; font-weight:900; font-size:16px; cursor:pointer; }
    .btn-main:disabled { opacity:.5; cursor:not-allowed; }
    .msg { padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600; margin-top:12px; }
    .msg.ok { background:#DCFCE7; color:#166534; border:1px solid #BBF7D0; }
    .msg.warn { background:#FEF3C7; color:#92400E; border:1px solid #FDE68A; }
    .msg.err { background:#FEE2E2; color:#991B1B; border:1px solid #FECACA; }
    .sale-row { border-bottom:1px solid #F3F4F6; padding:10px 0; font-size:13px; }
    .sale-row.void { opacity:.55; text-decoration:line-through; }
  </style>
</head>
<body>
<div id="bstm-nav"></div>

<div id="auth-wall" style="display:none;min-height:70vh;align-items:center;justify-content:center;padding:40px;flex-direction:column;text-align:center;">
  <div style="font-size:56px;margin-bottom:16px;">🔒</div>
  <h2 style="font-size:24px;font-weight:900;color:#1E1B4B;margin-bottom:8px;">Login Required</h2>
  <p style="color:#9CA3AF;margin-bottom:24px;">Log in to use the counter.</p>
  <a href="login.html?redirect=counter.html" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px 32px;border-radius:14px;font-weight:800;text-decoration:none;">Login →</a>
</div>

<div id="no-room" style="display:none;min-height:60vh;align-items:center;justify-content:center;padding:40px;flex-direction:column;text-align:center;">
  <div style="font-size:56px;margin-bottom:16px;">🏪</div>
  <h2 style="font-size:22px;font-weight:900;color:#1E1B4B;margin-bottom:8px;">No room to sell from yet</h2>
  <p style="color:#9CA3AF;margin-bottom:24px;">The counter works for rooms you own or work in.</p>
  <a href="open-room.html" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px 32px;border-radius:14px;font-weight:800;text-decoration:none;">Open a room →</a>
</div>

<main id="counter-content" style="display:none;max-width:1100px;margin:0 auto;padding:20px 16px 60px;">
  <div class="card" style="margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;">
    <div>
      <p style="font-size:12px;color:#9CA3AF;font-weight:700;margin:0;">COUNTER</p>
      <h1 id="room-title" style="font-size:20px;font-weight:900;color:#1E1B4B;margin:0;"></h1>
      <select id="room-switch" class="inp" style="display:none;margin-top:8px;max-width:340px;"></select>
    </div>
    <div style="text-align:right;">
      <p style="font-size:12px;color:#9CA3AF;font-weight:700;margin:0;">WALK-IN TODAY</p>
      <p id="today-total" style="font-size:22px;font-weight:900;color:#059669;margin:0;">P0.00</p>
      <p id="today-count" style="font-size:12px;color:#9CA3AF;margin:0;"></p>
    </div>
  </div>

  <div class="layout">
    <section id="catalog" class="card">
      <input id="search" class="inp" type="search" placeholder="Search products…" autocomplete="off">
      <div id="product-groups"></div>
      <details style="margin-top:16px;">
        <summary style="cursor:pointer;font-weight:800;color:#7C3AED;font-size:13px;">+ Item not in the list (custom item)</summary>
        <div style="display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px;">
          <input id="custom-name" class="inp" type="text" maxlength="120" placeholder="What was sold?">
          <input id="custom-price" class="inp" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Price">
          <button id="custom-add" type="button" class="pill">Add</button>
        </div>
      </details>
    </section>

    <aside id="cart-panel" class="card">
      <h2 style="font-size:16px;font-weight:900;color:#1E1B4B;margin:0 0 10px;">Current sale</h2>
      <div id="cart-lines"></div>
      <div id="pay-methods" style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;"></div>
      <details>
        <summary style="cursor:pointer;font-weight:700;color:#6B7280;font-size:13px;">Customer phone &amp; note (optional)</summary>
        <input id="cust-phone" class="inp" type="tel" maxlength="20" placeholder="Customer phone (for repeat-customer tracking)" style="margin-top:10px;">
        <input id="cust-note" class="inp" type="text" maxlength="200" placeholder="Note" style="margin-top:8px;">
      </details>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 10px;">
        <span style="font-weight:800;color:#374151;">Total</span>
        <span id="cart-total" style="font-size:26px;font-weight:900;color:#1E1B4B;">P0.00</span>
      </div>
      <button id="record-btn" class="btn-main" disabled>Record sale</button>
      <button id="clear-btn" type="button" style="width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-weight:700;cursor:pointer;display:none;">Clear sale</button>
      <div id="sale-msg" style="display:none;"></div>
    </aside>
  </div>

  <section id="today" class="card" style="margin-top:16px;">
    <h2 style="font-size:16px;font-weight:900;color:#1E1B4B;margin:0 0 6px;">Today's walk-in sales</h2>
    <p id="today-note" style="font-size:12px;color:#9CA3AF;margin:0 0 8px;"></p>
    <div id="today-list"></div>
  </section>
</main>

<div id="bstm-footer"></div>
<script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js?v=1792108428"></script>
<script type="module" src="js/pages/counter.js?v=1792108428"></script>
</body>
</html>
