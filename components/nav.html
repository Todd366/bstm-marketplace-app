<!-- BSTM Universal Navigation: three workspaces (Buyer, Seller, Admin), each with its own menu; see js/core/workspaces.js -->

<style>
  #bstm-nav-bar {
    background:#00708E;
    border-bottom:3px solid #06502F;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 12px rgba(0,112,142,0.25);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  .nav-link {
    color:rgba(255,255,255,0.92);
    font-weight:600;
    font-size:13px;
    padding:6px 10px;
    border-radius:10px;
    text-decoration:none;
    display:inline-block;
  }

  .nav-link:hover {
    background:rgba(255,255,255,0.16);
    color:#fff;
  }

  #desktop-nav {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  #mobile-menu {
    display:none;
    background:#fff;
    border-top:1px solid #D7E3E8;
    padding:12px 16px 20px;
    max-height:calc(100vh - 67px);
    overflow-y:auto;
  }

  #mobile-menu.open {
    display:block;
  }

  #mobile-menu a {
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-radius:12px;
    font-weight:600;
    color:#122128;
    text-decoration:none;
    min-height:44px;
  }

  #mobile-menu a:hover {
    background:#EAF5F8;
    color:#00708E;
  }

  #notif-panel {
    position:fixed;
    top:68px;
    right:16px;
    width:340px;
    max-width:calc(100vw - 32px);
    background:#fff;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,112,142,0.18);
    border:1px solid #D7E3E8;
    z-index:9999;
    display:none;
  }

  #notif-panel.open {
    display:block;
  }

  #menu-btn {
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    min-width:44px;
    min-height:44px;
  }

  #menu-btn span {
    width:22px;
    height:2px;
    background:#fff;
    display:block;
    border-radius:2px;
  }

  #desktop-nav { align-items:center; flex-wrap:nowrap; }
  .nav-link { white-space:nowrap; }
  .nav-link.is-active { background:rgba(255,255,255,0.22); color:#fff; }

  /* dropdown groups: native <details>, no script needed to open */
  .nav-group { position:relative; }
  .nav-group > summary { list-style:none; cursor:pointer; }
  .nav-group > summary::-webkit-details-marker { display:none; }
  .nav-group > summary::after { content:"\25BE"; margin-left:5px; font-size:10px; opacity:.9; }
  .nav-group[open] > summary { background:rgba(255,255,255,0.16); color:#fff; }
  .nav-menu {
    position:absolute; top:calc(100% + 8px); left:0; min-width:220px; z-index:300;
    background:#fff; border:1px solid #D7E3E8; border-radius:12px; padding:6px;
    box-shadow:0 12px 28px rgba(0,0,0,0.16);
  }
  .nav-menu a {
    display:block; padding:10px 12px; border-radius:8px; color:#122128;
    font-size:13px; font-weight:600; text-decoration:none;
  }
  .nav-menu a:hover, .nav-menu a:focus-visible, .nav-menu a.is-active { background:#EAF5F8; color:#00708E; }

  .nav-cart-count {
    display:inline-block; margin-left:6px; min-width:18px; padding:1px 6px; border-radius:999px;
    background:#fff; color:#00708E; font-size:11px; font-weight:800; line-height:16px; text-align:center;
  }
  .nav-cart-count[hidden] { display:none; }
  #mobile-menu .nav-cart-count { background:#00708E; color:#fff; }

  #mobile-menu .mm-head {
    margin:14px 6px 4px; padding-top:10px; border-top:1px solid #E5EEF1;
    font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#5B6B73;
  }
  #mobile-menu .mm-head:first-child { margin-top:2px; border-top:none; padding-top:0; }
  #mobile-menu a.is-active { background:#EAF5F8; color:#00708E; }


  /* workspace switch */
  #ws-switch { display:flex; align-items:center; }
  #ws-switch[hidden] { display:none; }
  .ws-chip {
    display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
    background:rgba(255,255,255,0.18); color:#fff; font-size:12px; font-weight:800; letter-spacing:.02em;
    border:1px solid rgba(255,255,255,0.35); white-space:nowrap; list-style:none; cursor:pointer;
  }
  .ws-chip.ws-static { cursor:default; }
  .ws-group > summary::after { content:"\25BE"; margin-left:2px; font-size:10px; }
  .ws-menu { min-width:260px; }
  .ws-current { padding:10px 12px 8px; font-size:12px; color:#122128; border-bottom:1px solid #E5EEF1; margin-bottom:4px; }
  .ws-current small, .ws-option small { display:block; margin-top:2px; font-size:11px; font-weight:500; color:#5B6B73; }
  .ws-option {
    display:block; width:100%; text-align:left; padding:10px 12px; border:none; background:none; border-radius:8px;
    font-size:13px; font-weight:700; color:#122128; cursor:pointer; text-decoration:none; font-family:inherit;
  }
  .ws-option:hover, .ws-option:focus-visible { background:#EAF5F8; color:#00708E; }
  #mobile-menu .ws-phone { margin:0 0 10px; padding:12px; border-radius:14px; background:#EAF5F8; }
  #mobile-menu .ws-phone-label { font-size:12px; font-weight:800; color:#00708E; margin-bottom:8px; }
  #mobile-menu .ws-segs { display:flex; gap:6px; flex-wrap:wrap; }
  #mobile-menu .ws-seg {
    flex:1 1 90px; min-height:44px; padding:8px 10px; border-radius:10px; border:1px solid #BFD9E2; background:#fff;
    font-size:13px; font-weight:700; color:#122128; cursor:pointer; font-family:inherit;
  }
  #mobile-menu .ws-seg.on { background:#00708E; border-color:#00708E; color:#fff; }
  #mobile-menu a.ws-start { margin-top:8px; background:#fff; border:1px solid #BFD9E2; font-size:13px; }

  @media(max-width:1100px){
    #desktop-nav { display:none; }
    /* below 1100px the switch lives in the menu button (workspace block at the top); the chip only shows where you are */
    .ws-group > .nav-menu { display:none !important; }
    .ws-group > summary { pointer-events:none; }
    .ws-group > summary::after { display:none; }
  }
  @media(max-width:480px){
    .ws-label { display:none; }
    .ws-chip { padding:7px 9px; }
  }
  /* small phones: the logo tile stays, its wordmark makes room for the workspace chip */
  @media(max-width:420px){
    #bstm-nav-bar a[href="index.html"] > div:last-child { display:none; }
    #bstm-nav-bar > div { padding:0 8px !important; }
    .nav-right { gap:2px !important; }
    .nav-right #lang-en-btn, .nav-right #lang-tn-btn { padding:6px 7px !important; }
    #nav-user-name { max-width:72px !important; padding:10px 8px !important; }
    #nav-login-btn { padding:9px 10px !important; }
    #bstm-nav-bar > div > div > div:first-child { gap:8px !important; }
  }

  /* phones: keep the whole header inside the screen (verified at 390px wide) */
  @media(max-width:480px){
    #bstm-nav-bar > div { padding:0 12px !important; }
    .nav-right { gap:4px !important; }
    .nav-right #lang-en-btn, .nav-right #lang-tn-btn { padding:6px 8px !important; }
    #nav-login-btn { padding:10px 12px !important; font-size:13px !important; }
    #nav-user-name { max-width:104px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:10px 10px !important; }
  }
</style>

<div id="bstm-nav-bar">

  <div style="max-width:1280px;margin:0 auto;padding:0 20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;height:64px;">

      <!-- LEFT -->
      <div style="display:flex;align-items:center;gap:18px;">

        <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">

          <div style="width:42px;height:42px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <img src="img/bstm-mark.png" alt="BSTM" width="34" height="22" style="width:34px;height:auto;display:block;">
          </div>

          <div>
            <div style="font-weight:800;font-size:19px;color:#fff;line-height:1.1;">BSTM</div>
            <div style="font-size:9px;color:#B6E0EA;font-weight:700;letter-spacing:.08em;">DIGITAL MALL</div>
          </div>

        </a>

        <!-- DESKTOP NAV (role-filtered by app.js) -->
        <div id="ws-switch" hidden></div>

        <!-- DESKTOP NAV: painted by js/core/workspaces.js for the current workspace -->
        <nav id="desktop-nav" aria-label="Main"></nav>

      </div>

      <!-- RIGHT -->
      <div class="nav-right" style="display:flex;align-items:center;gap:12px;">

        <button id="lang-en-btn" onclick="MultiLanguage.setLanguage('en')" style="padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;">EN</button>
        <button id="lang-tn-btn" onclick="MultiLanguage.setLanguage('tn')" style="padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;">TN</button>

        <button id="notif-btn" aria-label="Notifications" style="position:relative;background:none;border:none;font-size:18px;cursor:pointer;min-width:44px;min-height:44px;">
          🔔
          <span id="nav-notif-badge" style="display:none;position:absolute;top:-4px;right:-6px;background:#DC2626;color:#fff;font-size:10px;font-weight:700;line-height:1;padding:3px 5px;border-radius:999px;min-width:16px;text-align:center;">0</span>
        </button>

        <a id="nav-login-btn" href="login.html" data-i18n="common.login"
           style="background:#fff;color:#00708E;padding:10px 18px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;">
          Login
        </a>

        <div id="nav-user-menu" style="display:none;align-items:center;gap:8px;position:relative;">
          <button id="nav-user-name" onclick="document.getElementById('nav-user-dropdown').classList.toggle('open')"
                  style="background:rgba(255,255,255,0.16);color:#fff;padding:10px 14px;border-radius:12px;border:none;font-weight:700;font-size:13px;cursor:pointer;min-height:44px;">
          </button>
          <div id="nav-user-dropdown"
               style="display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #D7E3E8;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);min-width:160px;overflow:hidden;z-index:200;">
            <a href="profile.html" style="display:block;padding:12px 16px;color:#374151;text-decoration:none;font-size:13px;font-weight:600;">👤 Profile</a>
            <a href="settings.html" style="display:block;padding:12px 16px;color:#374151;text-decoration:none;font-size:13px;font-weight:600;">⚙️ Settings</a>
            <a href="notifications-all.html" style="display:block;padding:12px 16px;color:#374151;text-decoration:none;font-size:13px;font-weight:600;">🔔 Notifications</a>
            <a href="kyc-verification.html" style="display:block;padding:12px 16px;color:#374151;text-decoration:none;font-size:13px;font-weight:600;">🪪 Verify Identity</a>
            <button id="nav-logout-btn" onclick="window.BSTM.logout()"
                    style="display:block;width:100%;text-align:left;padding:12px 16px;color:#DC2626;background:none;border:none;border-top:1px solid #F3F4F6;font-size:13px;font-weight:600;cursor:pointer;">🚪 Logout</button>
          </div>
        </div>

        <style>
          #nav-user-dropdown.open { display: block !important; }
        </style>

        <button id="menu-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>

    </div>
  </div>

  <!-- MOBILE MENU: workspace switch + that workspace's links, painted by js/core/workspaces.js -->
  <div id="mobile-menu"></div>

</div>

<!-- NOTIFICATION PANEL (real data, wired by js/core/nav-notifications.js) -->
<div id="notif-panel">
  <div style="background:#00708E;color:#fff;padding:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;">
    <span>Notifications</span>
    <button onclick="window.BSTM_markAllNavNotifsRead && window.BSTM_markAllNavNotifsRead()" style="background:none;border:none;color:#fff;font-size:11px;font-weight:600;cursor:pointer;opacity:0.9;">Mark all read</button>
  </div>
  <div id="nav-notif-list" style="max-height:320px;overflow-y:auto;padding:6px;">
    <div style="padding:16px;color:#9CA3AF;font-size:13px;text-align:center;">Loading…</div>
  </div>
  <a href="notifications-all.html" style="display:block;text-align:center;padding:10px;font-size:12px;font-weight:700;color:#00708E;text-decoration:none;border-top:1px solid #D7E3E8;">See all</a>
</div>
