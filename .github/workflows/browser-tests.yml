name: Browser tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Playwright is installed here only (not in package.json) so the Vercel build never downloads it.
      - name: Install test tooling
        run: npm install --no-save --no-audit --no-fund playwright@^1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: node tests/browser/run.mjs
