<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — BSTM</title>
  <link href="css/tailwind.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap");
    *{font-family:'Inter',sans-serif;box-sizing:border-box;}
    html,body{overflow-x:hidden;max-width:100vw;background:#F8F7FF;}
    input,select{width:100%;padding:12px 14px;border:2px solid #EDE9FE;border-radius:12px;font-size:14px;color:#1E1B4B;outline:none;background:#fff;}
    input:focus,select:focus{border-color:#7C3AED;}
    label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px;}
    .field{margin-bottom:18px;}
    .info-row{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;border-bottom:1px solid #F3F4F6;}
    .info-icon{font-size:20px;width:24px;text-align:center;flex-shrink:0;margin-top:2px;}
    .info-label{font-size:13px;font-weight:700;color:#1E1B4B;margin-bottom:2px;}
    .info-value{font-size:14px;color:#6B7280;}
  </style>
</head>
<body style="background:#F8F7FF;">
<div id="bstm-nav"></div>

<div style="max-width:640px;margin:0 auto;padding:32px 20px 80px;">

  <div id="auth-wall" style="display:none;text-align:center;padding:80px 20px;">
    <div style="font-size:56px;margin-bottom:16px;">🔒</div>
    <h2 style="font-size:22px;font-weight:900;color:#1E1B4B;margin-bottom:8px;">Login Required</h2>
    <a href="login.html" style="background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;padding:14px 32px;border-radius:14px;font-weight:800;text-decoration:none;">Login →</a>
  </div>

  <div id="profile-content" style="display:none;">

    <!-- Avatar header -->
    <div style="background:linear-gradient(135deg,#7C3AED,#4F46E5);border-radius:24px;padding:28px;color:#fff;text-align:center;margin-bottom:20px;">
      <div style="width:80px;height:80px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;font-weight:900;border:3px solid rgba(255,255,255,0.4);" id="avatar-letter">?</div>
      <h1 style="font-size:22px;font-weight:900;margin:0 0 4px;" id="profile-name">Loading...</h1>
      <p style="font-size:13px;opacity:0.75;margin:0;" id="profile-email">—</p>
      <div style="margin-top:12px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
        <span style="background:rgba(255,255,255,0.2);padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;" id="profile-role">buyer</span>
        <span id="verified-badge" class="hidden" style="background:#DCFCE7;color:#166534;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;">✓ Verified</span>
      </div>
    </div>

    <!-- THB balance -->
    <div style="background:#fff;border-radius:20px;padding:20px;border:1px solid #EDE9FE;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:#9CA3AF;font-weight:600;margin-bottom:4px;">THB BALANCE</div>
        <div style="font-size:24px;font-weight:900;color:#7C3AED;" id="profile-thb">0.00 THB</div>
      </div>
      <a href="thb-wallet.html" style="background:#F5F3FF;color:#7C3AED;padding:10px 18px;border-radius:12px;font-weight:700;text-decoration:none;font-size:13px;">View Wallet →</a>
    </div>

    <!-- Profile summary (Google-style list rows) -->
    <div style="background:#fff;border-radius:20px;border:1px solid #EDE9FE;margin-bottom:16px;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 20px 4px;">
        <h2 style="font-size:16px;font-weight:900;color:#1E1B4B;margin:0;">Personal info</h2>
        <a href="settings.html" style="color:#7C3AED;font-weight:700;font-size:13px;text-decoration:none;">Edit →</a>
      </div>

      <div class="info-row">
        <div class="info-icon">👤</div>
        <div><div class="info-label">Name</div><div class="info-value" id="row-name">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">✉️</div>
        <div><div class="info-label">Email</div><div class="info-value" id="row-email">—</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📞</div>
        <div><div class="info-label">Phone</div><div class="info-value" id="row-phone">Not set</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div><div class="info-label">Location</div><div class="info-value" id="row-location">Not set</div></div>
      </div>
      <div class="info-row">
        <div class="info-icon">🏷️</div>
        <div><div class="info-label">Account type</div><div class="info-value" id="row-role">—</div></div>
      </div>
      <div class="info-row" style="border-bottom:none;">
        <div class="info-icon">📅</div>
        <div><div class="info-label">Member since</div><div class="info-value" id="row-since">—</div></div>
      </div>
    </div>

    <!-- Quick links -->
    <div style="background:#fff;border-radius:20px;padding:20px;border:1px solid #EDE9FE;">
      <h2 style="font-size:14px;font-weight:900;color:#1E1B4B;margin-bottom:14px;">Quick Links</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <a href="buyer-dashboard.html" style="background:#F5F3FF;color:#7C3AED;padding:12px;border-radius:12px;font-weight:700;text-decoration:none;font-size:13px;text-align:center;">🏠 Dashboard</a>
        <a href="settings.html" style="background:#F5F3FF;color:#7C3AED;padding:12px;border-radius:12px;font-weight:700;text-decoration:none;font-size:13px;text-align:center;">⚙️ Settings</a>
        <a href="kyc-verification.html" style="background:#F0FDF4;color:#166534;padding:12px;border-radius:12px;font-weight:700;text-decoration:none;font-size:13px;text-align:center;">✅ KYC Verify</a>
        <a href="order-tracking.html" style="background:#EFF6FF;color:#1D4ED8;padding:12px;border-radius:12px;font-weight:700;text-decoration:none;font-size:13px;text-align:center;">📦 Orders</a>
      </div>
    </div>
  </div>
</div>

<div id="bstm-footer"></div>
<script src="components/smart-loader.js"></script>
<script type="module" src="js/app.js?v=1788846845"></script>
<script type="module">
import { getProfile } from './js/bstm-core.js';
import { supabase } from './js/core/supabase-client.js';

window.BSTM.ready().then(async function(session) {
  if (!session) {
    document.getElementById('auth-wall').style.display = 'block';
    return;
  }
  document.getElementById('profile-content').style.display = 'block';

  var name = session.user.email.split('@')[0];
  document.getElementById('avatar-letter').textContent = name.charAt(0).toUpperCase();
  document.getElementById('profile-name').textContent = name;
  document.getElementById('profile-email').textContent = session.user.email;

  var { data: profile } = await getProfile(session.user.id);
  if (profile) {
    document.getElementById('profile-thb').textContent = (profile.thb_balance || 0).toFixed(2) + ' THB';
    document.getElementById('profile-role').textContent = profile.role || 'buyer';

    var displayName = session.user.user_metadata?.full_name || name;
    document.getElementById('profile-name').textContent = displayName;
    document.getElementById('avatar-letter').textContent = displayName.charAt(0).toUpperCase();

    document.getElementById('row-name').textContent = displayName;
    document.getElementById('row-email').textContent = session.user.email;
    document.getElementById('row-phone').textContent = profile.phone || 'Not set';
    document.getElementById('row-location').textContent = profile.location || 'Not set';
    document.getElementById('row-role').textContent = (profile.role || 'buyer').charAt(0).toUpperCase() + (profile.role || 'buyer').slice(1);
    document.getElementById('row-since').textContent = profile.created_at
      ? new Date(profile.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
      : '—';
  }

  // Real verification status — only show the badge if a KYC submission
  // was actually approved, not unconditionally like before.
  var { data: kyc } = await supabase
    .from('kyc_submissions')
    .select('status')
    .eq('user_id', session.user.id)
    .eq('status', 'approved')
    .maybeSingle();
  if (kyc) {
    document.getElementById('verified-badge').classList.remove('hidden');
  }
});

window.logout = function() {
  if (confirm('Logout?')) window.BSTM.logout();
};
</script>

</body>
</html>
