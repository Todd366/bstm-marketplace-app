<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Tomatoes - BSTM Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7C3AED">
    <link href="css/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); }
        .product-image { max-height: 500px; object-fit: cover; }
        .thumbnail { cursor: pointer; transition: all 0.3s ease; }
        .thumbnail:hover { transform: scale(1.1); border-color: #7C3AED; }
        .thumbnail.active { border-color: #7C3AED; border-width: 3px; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="bstm-nav"></div>
    
    <!-- Header -->
    

    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Breadcrumb -->
        <nav class="text-sm mb-8">
            <a href="index.html" class="text-gray-600 hover:text-purple-600">Home</a>
            <span class="mx-2 text-gray-400">/</span>
            <a href="marketplace.html" class="text-gray-600 hover:text-purple-600" id="breadcrumb-room">Mall</a>
            <span class="mx-2 text-gray-400">/</span>
            <span class="text-gray-800 font-semibold" id="breadcrumb-product">Loading…</span>
        </nav>

        <!-- Product Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-12">
            <!-- Product Images -->
            <div>
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-4" style="min-height:400px;display:flex;align-items:center;justify-content:center;background:#F5F3FF;">
                    <img id="mainImage" src="" alt="Product" class="w-full product-image" style="display:none;">
                    <span id="mainImage-fallback" style="font-size:64px;">🛍️</span>
                </div>
            </div>

            <!-- Product Info -->
            <div>
                <div class="flex items-center mb-4">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full mr-2" id="room-badge">
                        <i class="fas fa-store mr-1"></i><span id="room-badge-name">Loading…</span>
                    </span>
                    <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full">
                        <i class="fas fa-coins mr-1"></i>Earn <span id="thb-reward-badge">0.0</span> THB
                    </span>
                </div>

                <h1 class="text-4xl font-bold text-gray-800 mb-4" id="product-title">Loading…</h1>

                <div class="bg-gray-100 rounded-xl p-6 mb-6">
                    <div class="flex items-baseline mb-4">
                        <span class="text-5xl font-bold text-gray-800" id="product-price">P0</span>
                        <span class="text-xl text-purple-600 ml-4" id="product-thb">or 0.0 THB</span>
                    </div>
                </div>

                <div class="space-y-4 mb-6">
                    <div class="flex items-center">
                        <i class="fas fa-truck text-purple-600 mr-3"></i>
                        <span class="text-gray-700">CabLink Delivery Available</span>
                    </div>
                    <div class="flex items-center hidden" id="verified-seller-row">
                        <i class="fas fa-shield-alt text-blue-600 mr-3"></i>
                        <span class="text-gray-700">Verified Seller</span>
                    </div>
                    <div class="flex items-center hidden" id="ships-from-row">
                        <i class="fas fa-map-marker-alt text-red-500 mr-3"></i>
                        <span class="text-gray-700">Ships from: <span id="ships-from-location"></span></span>
                    </div>
                </div>

                <!-- Quantity Selector -->
                <div class="flex items-center mb-6">
                    <span class="text-gray-700 font-semibold mr-4">Quantity:</span>
                    <div class="flex items-center border-2 border-gray-300 rounded-lg">
                        <button onclick="decreaseQty()" class="px-4 py-2 text-gray-600 hover:bg-gray-100">
                            <i class="fas fa-minus"></i>
                        </button>
                        <input type="number" id="quantity" value="1" min="1" class="w-16 text-center border-0 focus:outline-none">
                        <button onclick="increaseQty()" class="px-4 py-2 text-gray-600 hover:bg-gray-100">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex space-x-4 mb-8">
                    <button id="add-to-cart-btn" class="flex-1 gradient-bg text-white py-4 px-8 rounded-xl font-bold text-lg hover:shadow-2xl transition-all">
                        <i class="fas fa-shopping-cart mr-2"></i>Add to Cart
                    </button>
                    <button id="wishlist-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 py-4 px-6 rounded-xl transition-all">
                        <i class="far fa-heart text-2xl" id="wishlist-icon"></i>
                    </button>
                </div>

                <a href="checkout.html" id="buy-now-btn" class="block w-full bg-green-600 hover:bg-green-700 text-white text-center py-4 px-8 rounded-xl font-bold text-lg transition-all">
                    <i class="fas fa-bolt mr-2"></i>Buy Now
                </a>

                <!-- Seller Info -->
                <div class="mt-8 bg-white border-2 border-gray-200 rounded-xl p-6">
                    <h3 class="font-bold text-gray-800 mb-4">Sold by</h3>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;" id="seller-avatar">S</div>
                            <div>
                                <h4 class="font-bold text-gray-800" id="seller-name-display">Seller</h4>
                            </div>
                        </div>
                        <button id="message-seller-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-semibold">
                            <i class="fas fa-comment mr-2"></i>Chat
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product Details Tabs -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <div class="border-b mb-6">
                <button class="px-6 py-3 border-b-2 border-purple-600 font-semibold text-purple-600">Description</button>
            </div>

            <div>
                <h3 class="text-2xl font-bold text-gray-800 mb-4">Product Description</h3>
                <p class="text-gray-700 leading-relaxed mb-4" id="product-description">Loading description…</p>
                <h4 class="font-bold text-gray-800 mb-2 mt-6">Category</h4>
                <p class="text-gray-700" id="product-category">—</p>
            </div>
        </div>

        <!-- Reviews -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold text-gray-800">Reviews</h3>
                <div id="review-summary" class="text-sm text-gray-500">Loading…</div>
            </div>

            <!-- Write review — hidden unless the visitor has a verified delivered purchase -->
            <div id="write-review-box" class="hidden bg-purple-50 rounded-2xl p-6 mb-6">
                <h4 class="font-bold text-gray-800 mb-3">Write a Review</h4>
                <div id="star-picker" class="flex gap-1 mb-3" style="font-size:28px;cursor:pointer;">
                    <span data-star="1">☆</span><span data-star="2">☆</span><span data-star="3">☆</span><span data-star="4">☆</span><span data-star="5">☆</span>
                </div>
                <textarea id="review-comment" rows="3" placeholder="Share your experience with this product…"
                          class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 mb-3"></textarea>
                <div id="review-error" class="hidden text-red-600 text-sm mb-2"></div>
                <button id="submit-review-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2.5 rounded-xl font-semibold">Submit Review</button>
            </div>

            <div id="reviews-list" class="space-y-4"></div>
        </div>

        <!-- Related Products (real, from same room) -->
        <div class="mb-8" id="related-products-section" style="display:none;">
            <h3 class="text-3xl font-bold text-gray-800 mb-8">More From This Room</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6" id="related-products-grid"></div>
        </div>
    </div>

    <!-- Footer -->
    

    <div id="bstm-footer"></div>
    <script src="components/smart-loader.js"></script>
    <script type="module" src="js/app.js?v=1786828104"></script>
    <script type="module" src="js/pages/product-detail.js?v=1788260255"></script>
</body>
</html>
